<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScamShield AI</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#020617;
  color:white;
  min-height:100vh;
}

.container{
  max-width:900px;
  margin:auto;
  padding:40px 20px;
}

.logo{
  font-size:32px;
  font-weight:bold;
  color:#10b981;
}

.subtitle{
  color:#94a3b8;
}

.card{
  margin-top:30px;
  background:#0f172a;
  border:1px solid #1e293b;
  border-radius:20px;
  padding:25px;
}

textarea{
  width:100%;
  height:150px;
  background:#020617;
  color:white;
  border:1px solid #334155;
  border-radius:12px;
  padding:15px;
  font-size:16px;
  box-sizing:border-box;
}

button{
  margin-top:20px;
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  background:#10b981;
  color:#022c22;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.result{
  margin-top:25px;
  padding:20px;
  border-radius:15px;
  background:#111827;
  display:none;
}

.green{
 color:#22c55e;
}

.red{
 color:#ef4444;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">🛡️ ScamShield AI</div>
<p class="subtitle">
AI-powered scam message detection and safety assistant
</p>

<div class="card">

<h2>Analyze Suspicious Message</h2>

<textarea id="message" placeholder="Paste SMS, WhatsApp, Email message here..."></textarea>

<button onclick="analyze()">Analyze Message</button>

<div id="result" class="result"></div>

</div>

</div>


<script>

function analyze(){

let text=document.getElementById("message").value.toLowerCase();
let result=document.getElementById("result");

let risk=20;
let reasons=[];

let keywords=[
"urgent",
"otp",
"lottery",
"winner",
"click link",
"prize",
"bank",
"verify account",
"password",
"upi"
];

keywords.forEach(word=>{
 if(text.includes(word)){
   risk+=10;
   reasons.push("Detected suspicious keyword: "+word);
 }
});


if(risk>=60){

result.innerHTML=
`
<h2 class="red">⚠️ High Risk Scam Detected</h2>
<p>Risk Score: ${risk}%</p>
<p>${reasons.join("<br>")}</p>
<p>Do not share OTP, passwords or banking details.</p>
`;

}else{

result.innerHTML=
`
<h2 class="green">✅ Low Risk</h2>
<p>Risk Score: ${risk}%</p>
<p>No major scam indicators detected.</p>
`;

}

result.style.display="block";

}

</script>

</body>
</html>
