<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ScamShield AI</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial, sans-serif;
background:#020617;
color:white;
}

.container{
max-width:900px;
margin:auto;
padding:30px 20px;
}

.logo{
font-size:34px;
font-weight:800;
color:#10b981;
}

.tagline{
color:#94a3b8;
margin-bottom:25px;
}

.card{
background:#0f172a;
border:1px solid #1e293b;
border-radius:20px;
padding:25px;
}

textarea{
width:100%;
height:160px;
padding:15px;
border-radius:12px;
border:1px solid #334155;
background:#020617;
color:white;
font-size:16px;
resize:none;
}

button{
width:100%;
margin-top:20px;
padding:15px;
border:0;
border-radius:12px;
background:#10b981;
color:#022c22;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.result{
display:none;
margin-top:25px;
padding:20px;
border-radius:15px;
background:#111827;
}

.high{
color:#ef4444;
}

.medium{
color:#f59e0b;
}

.safe{
color:#22c55e;
}

.reason{
color:#cbd5e1;
margin:8px 0;
}

.tip{
margin-top:15px;
color:#34d399;
}
</style>

</head>

<body>

<div class="container">

<div class="logo">🛡️ ScamShield AI</div>
<p class="tagline">
AI-powered scam message detection and safety assistant
</p>

<div class="card">

<h2>Analyze Suspicious Message</h2>

<textarea id="message" placeholder="Paste SMS, WhatsApp, Email or suspicious message here..."></textarea>

<button onclick="analyzeMessage()">
Analyze Message
</button>

<div id="result" class="result"></div>

</div>

</div><script>

function analyzeMessage(){

let text = document.getElementById("message").value.toLowerCase();

let risk = 0;
let reasons = [];

function addRisk(points, reason){
risk += points;
reasons.push(reason);
}


// Scam patterns

if(text.includes("lottery") || text.includes("prize") || text.includes("winner")){
addRisk(35,"Fake lottery or prize offer detected");
}

if(text.includes("otp")){
addRisk(35,"OTP request detected - scammers often use this to steal accounts");
}

if(text.includes("bank") && (text.includes("verify") || text.includes("link") || text.includes("otp"))){
addRisk(40,"Bank verification scam pattern detected");
}

if(text.includes("click") && text.includes("link")){
addRisk(30,"Suspicious link request detected");
}

if(text.includes("account blocked") || text.includes("account will be blocked") || text.includes("suspended")){
addRisk(35,"Account threat or blocking message detected");
}

if(text.includes("kyc") || text.includes("update your details")){
addRisk(30,"Possible fake KYC/update request detected");
}

if(text.includes("password") || text.includes("pin")){
addRisk(35,"Sensitive information request detected");
}

if(text.includes("free money") || text.includes("guaranteed profit")){
addRisk(35,"Unrealistic money promise detected");
}

if(text.includes("job") && (text.includes("pay") || text.includes("fee") || text.includes("registration"))){
addRisk(30,"Possible fake job scam detected");
}

if(text.includes("investment") || text.includes("crypto")){
addRisk(25,"Investment scam indicator detected");
}

if(text.includes("urgent") || text.includes("immediately") || text.includes("act now")){
addRisk(20,"Pressure or urgency tactic detected");
}


// Limit score

if(risk > 100){
risk = 100;
}


let result = document.getElementById("result");

let reasonsHTML = "";

reasons.forEach(function(item){
reasonsHTML += `<p class="reason">⚠️ ${item}</p>`;
});


if(risk >= 70){

result.innerHTML = `
<h2 class="high">🚨 HIGH RISK SCAM</h2>
<h3>Risk Score: ${risk}%</h3>
${reasonsHTML}
<p class="tip">🛡️ Safety Tip: Do not click links or share OTP, passwords, or banking details.</p>
`;

}

else if(risk >= 40){

result.innerHTML = `
<h2 class="medium">⚠️ MEDIUM RISK</h2>
<h3>Risk Score: ${risk}%</h3>
${reasonsHTML}
<p class="tip">🛡️ Verify the sender before taking any action.</p>
`;

}

else{

result.innerHTML = `
<h2 class="safe">✅ LOW RISK</h2>
<h3>Risk Score: ${risk}%</h3>
<p>No strong scam indicators found.</p>
<p class="tip">🛡️ Still stay cautious with unknown messages.</p>
`;

}

result.style.display="block";

}

</script>

</body>
</html>
