<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScamShield AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="logo">🛡️ ScamShield AI</div>
    <p class="tagline">AI-powered scam message detection and safety assistant</p>

    <div class="card">
      <h2>Analyze Suspicious Message</h2>
      <textarea id="message" placeholder="Paste SMS, WhatsApp, Email or suspicious message here..."></textarea>
      <button onclick="analyzeMessage()">Analyze Message</button>
      <div id="result" class="result"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
